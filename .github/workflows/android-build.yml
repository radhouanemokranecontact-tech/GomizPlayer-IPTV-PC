name: Android Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools" || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK
        env:
          GOMIZ_KEYSTORE: ${{ secrets.GOMIZ_KEYSTORE_PATH }}
          GOMIZ_KEYSTORE_PASSWORD: ${{ secrets.GOMIZ_KEYSTORE_PASSWORD }}
          GOMIZ_KEY_ALIAS: ${{ secrets.GOMIZ_KEY_ALIAS }}
          GOMIZ_KEY_PASSWORD: ${{ secrets.GOMIZ_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build release AAB
        env:
          GOMIZ_KEYSTORE: ${{ secrets.GOMIZ_KEYSTORE_PATH }}
          GOMIZ_KEYSTORE_PASSWORD: ${{ secrets.GOMIZ_KEYSTORE_PASSWORD }}
          GOMIZ_KEY_ALIAS: ${{ secrets.GOMIZ_KEY_ALIAS }}
          GOMIZ_KEY_PASSWORD: ${{ secrets.GOMIZ_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
          fail_on_unmatched_files: false
